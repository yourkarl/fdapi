# 文档站构建检查：push / PR 时验证 docusaurus build 是否通过
# 同时验证内容生成管线 Python 依赖可用，并执行内容完整性检查（杜绝半截写入损坏入库）
name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取完整 git 历史，showLastUpdateTime 才能显示真实最近更新时间（浅克隆会显示构建时间）

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 pyyaml

      # 只校验「日常管线实际会跑」的脚本。
      # 注意：regenerate_docs.py / gen_sidebar.py / gen_types.js / insert_skills.js / linkify_types.js
      # 为一次性迁移脚本，已封存，不再纳入 CI，也不应被重新执行（会覆盖手写文档）。
      - name: Verify generation scripts are importable
        run: |
          python3 -c "import bs4; print('beautifulsoup4 OK')"
          python3 -c "
          import ast, sys
          scripts = ['gen_dts.py', 'gen_param_meta.py', 'gen_real_examples.py',
                     'gen_llms_txt.py', 'check_docs_integrity.py', 'gen_utils.py']
          for f in scripts:
            try:
              ast.parse(open(f, encoding='utf-8').read())
              print(f, 'syntax OK')
            except SyntaxError as e:
              print(f'FAIL {f}:', e, file=sys.stderr)
              sys.exit(1)
          "

      # 内容完整性门禁：UTF-8 合法性 / 无 NUL 空字节 / front matter YAML 可解析
      # 拦截「写了一半」的损坏文件（曾出现：尾部空字节、汉字被截断、引号未转义）
      - name: Content integrity check
        run: python3 check_docs_integrity.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 派生物同步门禁：docs/api/*.md 是唯一手写源，d.ts / 参数元数据 / 示例索引 / llms.txt
      # 全部由脚本派生。若源文档改了但没重跑生成脚本，站点会出现「文档与补全不一致」。
      # 这里重新生成一遍，要求工作区无差异，否则失败并提示本地执行 npm run gen。
      - name: Verify generated artifacts are up to date
        run: |
          npm run gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::派生物与源文档不一致，请在本地执行 npm run gen 后一并提交。"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "派生物与源文档一致。"

      - run: npm run build
