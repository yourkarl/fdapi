<!doctype html>
<html>
  <head>
    <title>testgeojson</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script type="text/javascript" src="../../ac.min.js"></script>
    <script type="text/javascript" src="../../ac_conf.js"></script>
    <script
      type="text/javascript"
      src="scripts/jquery/jquery-3.7.0.min.js"
    ></script>
  </head>

  <body>
    <div style="position: absolute; z-index: 999; left: 10px; top: 10px">
          <button onclick="loadgeojson()">Load GeoJSON</button>
    </div>
    <div
      id="player"
      style="margin: 0px; overflow: hidden; background-color: black"
    ></div>

    <!-- 图例容器：由 classBreakInfos 配色信息动态生成 -->
    <div
      id="legend"
      style="
        position: absolute;
        z-index: 1000;
        right: 16px;
        bottom: 16px;
        min-width: 140px;
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        color: #fff;
        font-family: 'Microsoft YaHei', Arial, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      "
    ></div>
  </body>
</html>

<script>
  var fdplayer;
  var disableResizeObserver = false; //如果出现视频画面不断调整大小的闪烁，可设置为true

  function resize() {
    let p = document.getElementById("player");
    p.style.height = window.innerHeight + "px";
    p.style.width = window.innerWidth + "px";

    if (disableResizeObserver) fdplayer?.resize();
  }

  function init() {
    let urlParams = new URLSearchParams(window.location.search);

    //用户名
    let username = urlParams.get("username");
    if (!username) {
      let userLoginInfo = JSON.parse(localStorage.getItem("userLoginInfo"));
      if (userLoginInfo) username = userLoginInfo.username;
    }

    //DigitalTwinPlayer
    let options = {
      domId: "player", //HTML元素ID（它将作为要创建的Video标签的父元素）
      iid: urlParams.get("iid"), //云渲染实例的ID
      pid: urlParams.get("pid"), //指定实例要加载的工程ID
      password: urlParams.get("password"), // 实例访问密码
      ui: {
        statusButton: true, //默认值为false，是否在左下角显示信息按钮（如果不需要，直接去掉此属性即可）
        fullscreenButton: true, //默认值为false，是否在右下角显示全屏按钮（如果不需要，直接去掉此属性即可）
        homeButton: true, //默认值为false，是否在左下角显示“回到初始位置”按钮（如果不需要，直接去掉此属性即可）
        debugEventsPanel: urlParams.get("debugEventsPanel"), //是否显示事件详细信息（仅用于调试）
      },
      urlExtraInfo: {
        uid: urlParams.get("uid"), //用于授权管理（2023.05.31）
        username: username, //用于用户登录（2023.12.16）
      },
      apiOptions: {
        onLog: (msg, noLineBreak, color) => {
          //日志回调（2023.05.31）
          console.log("Player Log:", msg);
        },
        onEvent: (e) => {
          if (e.eventtype == "LeftMouseButtonClick" && e.ObjectID) {
            // clearCO();
            setTimeout(() => {
              if (isListen) {
                splitRoom(e);
              }
            }, 1000);
          }
        },
      },
      events: {
        onLoginRequired: (captchaRequired) => {
          //如果开启了用户系统，当需要登录的时候会调用此方法（2023.12.16）
          let href =
            "login.html?from=player&captcha=" + (captchaRequired ? 1 : 0);
          if (options.pid) href += "&pid=" + options.pid;
          if (options.iid) href += "&iid=" + options.iid;
          location.href = href;
        },
      },
      disableResizeObserver: disableResizeObserver, //默认值为false，可选参数
    };

    /**
     * 2023.03.21 处理服务器连接的端口映射问题
     *            仅用于SDK测试页面。 如果用户的网络环境是这样的：内网无法连接映射的公网IP和端口，需要进行内外网访问地址的处理
     * 说明：
     *      CloudMaster启动后会修改HostConfig
     *      HostConfig.Player：内网地址
     *      HostConfig.PlayerMapping：外网地址
     */
    let playerHost = HostConfig.Player; //默认使用内网地址
    if (location.protocol != "file:") {
      //如果是通过HTTP服务访问
      if (
        HostConfig.Player.indexOf(location.hostname) == -1 &&
        HostConfig.PlayerMapping
      )
        playerHost = HostConfig.PlayerMapping; //如果URL不是内网地址，并且开启了端口映射，则使用映射地址和端口进行WebSocket连接
    }
    fdplayer = new DigitalTwinPlayer(playerHost, options);
  }

  /**
   * 将 [r, g, b, a] 颜色数组（取值 0~1）转换为 CSS rgba() 字符串
   * 计算方式：r/g/b 乘以 255 取整，a 直接作为透明度
   */
  function colorArrayToCss(color) {
    let r = Math.round((color[0] ?? 0) * 255);
    let g = Math.round((color[1] ?? 0) * 255);
    let b = Math.round((color[2] ?? 0) * 255);
    let a = color[3] ?? 1;
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }

  /**
   * 根据 renderer.classBreakInfos 的配色信息生成图例
   * @param {Array} classBreakInfos 分段配色信息
   * @param {string} title 图例标题（一般为渲染字段名）
   */
  function createLegend(classBreakInfos, title) {
    let legend = document.getElementById("legend");
    if (!legend) return;

    let html = `<div style="font-weight:bold;margin-bottom:8px;">${
      title || "图例"
    }</div>`;

    classBreakInfos.forEach((info) => {
      let css = colorArrayToCss(info.symbol.color);
      let label = `${info.minValue} ~ ${info.maxValue}`;
      html += `
        <div style="display:flex;align-items:center;margin:4px 0;">
          <span style="display:inline-block;width:18px;height:18px;
            margin-right:8px;border:1px solid rgba(255,255,255,0.6);
            background:${css};"></span>
          <span>${label}</span>
        </div>`;
    });

    legend.innerHTML = html;
  }

  function loadgeojson() {
    //添加前先清除保证id唯一
    fdapi.geoJSONLayer.clear();

    //自定义材质示例
    let layer6 = {
      id: "layer6",
      visible: true,
      rotation: [0, 0, 0],
      offset: [0, 0, 0],
      needProject: true,
      textField: "NOWNAME", //geojson文件内的属性字段名称
      textRange: [0, 280],
      onTerrain: false,
      collision: true,

      url: HostConfig.Path + "/assets/geojson/polygon_84.geojson",
      renderer: {
        rendererType: 2,
        materials: [
          {
            index: 0,
            material:
              "/JC_CustomAssets/MaterialLibrary/Exhibition/其他/Geojson_1",
            scalarParameters: [
              { name: "不透明度", value: 0.2 },
              { name: "类型", value: 0 },
            ],
            vectorParameters: [{ name: "Color", value: [1, 1, 1, 1] }],
          },
          {
            index: 1,
            material:
              "/JC_CustomAssets/MaterialLibrary/Exhibition/其他/Geojson_1",
            scalarParameters: [
              { name: "亮度", value: 1 },
              { name: "类型", value: 1 },
            ],
            vectorParameters: [{ name: "Color", value: [1, 1, 1, 1] }],
          },
          {
            index: 2,
            material:
              "/JC_CustomAssets/MaterialLibrary/Exhibition/其他/Geojson_1",
            scalarParameters: [
              { name: "亮度", value: 1 },
              { name: "类型", value: 2 },
            ],
            vectorParameters: [{ name: "Color", value: [1, 1, 1, 1] }],
          },
          {
            index: 3,
            material:
              "/JC_CustomAssets/MaterialLibrary/Exhibition/其他/Geojson_1",
            scalarParameters: [
              { name: "亮度", value: 1 },
              { name: "类型", value: 3 },
            ],
            vectorParameters: [{ name: "Color", value: [1, 1, 1, 1] }],
          },
        ],
        field: "BLDG_HEIGH",
        fieldType: 1,
        type: 0,
        gradient: true,
        defaultSymbol: {
          symbolType: 2,
          color: [1, 1, 0, 1],
          outline: {
            width: 1,
            color: [1, 1, 1, 1],
          },
        },

        classBreakInfos: [
          {
            minValue: 0,
            maxValue: 25,
            symbol: {
              color: [0, 0, 1, 1],
            },
          },
          {
            minValue: 25,
            maxValue: 50,
            symbol: {
              color: [0, 1, 0, 1],
            },
          },
          {
            minValue: 50,
            maxValue: 75,
            visible: true,
            symbol: {
              color: [1, 1, 0, 1],
            },
          },
          {
            minValue: 75,
            maxValue: 100,
            symbol: {
              //填充橙色   "color": "#f78d1e"
              color: [247 / 255, 141 / 255, 30 / 255, 1],
            },
          },
        ],
      },
      materialRenderer: {
        rendererType: 3,
        field: "BLDG_HEIGH",
        fieldType: 1,
        defaultMaterial: 0,
        materialValueInfos: [
          {
            minValue: 0,
            maxValue: 25,
            index: 0,
          },
          {
            minValue: 25,
            maxValue: 50,
            index: 1,
          },
          {
            minValue: 50,
            maxValue: 75,
            index: 2,
          },
          {
            minValue: 75,
            maxValue: 100,
            index: 3,
          },
        ],
      },
      visibleRenderer: {
        rendererType: 1,
        field: "BLDG_HEIGH",
        fieldType: 1,
        defaultVisible: true,
        visibleValueInfos: [
          {
            minValue: 0,
            maxValue: 25,
            visible: true,
          },
          {
            minValue: 25,
            maxValue: 50,
            visible: true,
          },
          {
            minValue: 50,
            maxValue: 75,
            visible: true,
          },
          {
            minValue: 75,
            maxValue: 100,
            visible: true,
          },
        ],
      },
    };
    fdapi.geoJSONLayer.add(layer6);

    //读取 renderer 中的 classBreakInfos 配色信息生成图例
    createLegend(layer6.renderer.classBreakInfos, layer6.renderer.field);
  }
  window.addEventListener("resize", resize, true);
  window.addEventListener("load", init, true);
</script>
